<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <title>الحسابات - وسيط</title>
  <style>
    body {
      background: #0f0f0f;
      color: white;
      font-family: Arial, sans-serif;
      padding: 40px 20px;
      text-align: center;
    }
    h1 { color: #00ff88; margin-bottom: 30px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      max-width: 1100px;
      margin: 0 auto;
    }
    .card {
      background: #1a1a1a;
      border-radius: 12px;
      padding: 20px;
      border: 1px solid #00ff88;
      text-align: right;
    }
    .card h2 { color: #00ff88; margin-bottom: 10px; }
    .card p { color: #ccc; margin: 6px 0; }
    .price { color: #00ff88; font-size: 22px; font-weight: bold; }
    .seller { color: #888; font-size: 14px; }
    .btn {
      display: inline-block;
      margin-top: 15px;
      background: #00ff88;
      color: black;
      padding: 10px 25px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }
    .back {
      display: inline-block;
      margin-bottom: 25px;
      color: #00ff88;
      text-decoration: none;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <a href="/" class="back">→ الرئيسية</a>
  <h1>🎮 الحسابات المعروضة</h1>

  <div class="grid">
    {% for account in accounts %}
    <div class="card">
      <h2>{{ account.game }}</h2>
      <p>{{ account.description }}</p>
      <p class="price">{{ account.price }} ريال</p>
      <p class="seller">البائع: {{ account.seller }}</p>
      <a href="/chat/{{ account.id }}" class="btn">تواصل مع البائع</a>
    </div>
    {% else %}
    <p style="text-align:center; color:#888;">لا يوجد حسابات معروضة حالياً</p>
    {% endfor %}
  </div>
</body>
</html>
