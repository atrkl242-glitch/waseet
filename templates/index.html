<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>وسيط - المنصة الآمنة لبيع وشراء الحسابات</title>
    <style>
        body {
            background: #0f0f0f;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }
        h1 { color: #00ff88; font-size: 36px; }
        p { color: #cccccc; font-size: 18px; margin-bottom: 30px; }
        .btn-container { margin-top: 20px; }
        .btn {
            background: #00ff88;
            color: black;
            padding: 12px 40px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            text-decoration: none;
            margin: 10px;
            display: inline-block;
            font-weight: bold;
        }
        .btn-secondary {
            background: transparent;
            color: #00ff88;
            border: 2px solid #00ff88;
        }
    </style>
</head>
<body>
  <h1>مرحباً بك في منصة وسيط 🎮</h1>
  <p>المنصة العربية الأولى لتداول ألعاب الفيديو بأمان تام وضمان حق الطرفين.</p>

  <div class="btn-container">
    {% if session['user'] %}
      <p>أهلاً، {{ session['user'] }} 👋</p>
      <a href="/sell" class="btn">انشر حسابك للبيع</a>
      <a href="/accounts" class="btn btn-secondary">تصفح الحسابات</a>
      <a href="/logout" class="btn btn-secondary">تسجيل الخروج</a>
    {% else %}
      <a href="/sell" class="btn">انشر حسابك للبيع</a>
      <a href="/login" class="btn btn-secondary">تسجيل الدخول</a>
    {% endif %}
  </div>
</body>
</html>
