<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول - وسيط</title>
    <style>
        body {
            background: #0f0f0f;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 50px;
        }
        h1 { color: #00ff88; }
        input {
            display: block;
            margin: 10px auto;
            padding: 12px;
            width: 300px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
        }
        .btn {
            background: #00ff88;
            color: black;
            padding: 12px 40px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <h1>تسجيل الدخول</h1>
    <form method="POST">
        <input type="email" name="email" placeholder="البريد الإلكتروني" required>
        <input type="password" name="password" placeholder="كلمة المرور" required>
        <button class="btn" type="submit">دخول</button>
    </form>
</body>
</html>
