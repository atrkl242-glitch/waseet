<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>بيع حساب - وسيط</title>
    <style>
        body {
            background: #0f0f0f;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 50px;
        }
        h1 { color: #00ff88; }
        input, textarea, select {
            display: block;
            margin: 10px auto;
            padding: 12px;
            width: 300px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
        }
        .btn {
            background: #00ff88;
            color: black;
            padding: 12px 40px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <h1>🎮 بيع حساب</h1>
    <form method="POST">
        <select name="game">
            <option>فورتنايت</option>
            <option>ببجي</option>
            <option>فري فاير</option>
            <option>كلاش اوف كلانس</option>
            <option>كلاش رويال</option>
            <option>فالورانت</option>
            <option>أوفر ووتش 2</option>
            <option>ليج اوف ليجندز</option>
            <option>كول اوف ديوتي موبايل</option>
            <option>ماين كرافت</option>
            <option>روبلوكس</option>
            <option>بوانتي رش</option>
            <option>براول ستارز</option>
            <option>هاي فايف</option>
            <option>GTA Online</option>
            <option>FIFA</option>
            <option>أبيكس ليجندز</option>
            <option>أخرى</option>
        </select>
        <input type="text" name="description" placeholder="وصف الحساب" required>
        <input type="number" name="price" placeholder="السعر بالريال" required>
        <button class="btn" type="submit">نشر الحساب</button>
    </form>
</body>
</html>
